version: '3.8'

services:
  aethercrypt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aethercrypt-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SESSION_SECRET=aether_secret_production_key_change_me
    volumes:
      - aethercrypt-data:/app/data

volumes:
  aethercrypt-data:
    driver: local
